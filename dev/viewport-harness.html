<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewport harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2b2d31; font: 12px system-ui, sans-serif; }
      #bar { position: fixed; left: 0; right: 0; top: 0; height: 30px; display: flex; gap: 4px; align-items: center; padding: 0 8px; color: #ddd; }
      #bar button { font: inherit; padding: 2px 8px; border-radius: 6px; border: 1px solid #666; background: #3a3d44; color: #eee; cursor: pointer; }
      #hint { margin-left: auto; opacity: 0.8; }
      #root { position: fixed; left: 8px; right: 8px; top: 34px; bottom: 8px; border-radius: 4px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="root"></div>
    <script type="module" src="./viewport-harness.tsx"></script>
  </body>
</html>
