<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain gallery (dev)</title>
    <style>
      body { margin: 0; padding: 12px; background: #1d1f23; color: #ddd; font: 12px system-ui, sans-serif; }

    <div id="grid"></div>
